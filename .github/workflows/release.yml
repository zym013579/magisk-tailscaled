name: Build and release Magisk module
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: Publish the version recorded in module.prop
        default: false
permissions:
  contents: read
concurrency:
  group: magisk-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.config.outputs.ref }}
      tailscale_version: ${{ steps.config.outputs.tailscale_version }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        run: |
          ref=$(sed -n 's/^TAILSCALE_REF=//p' binaries.env)
          version=$(sed -n 's/^TAILSCALE_VERSION=//p' binaries.env)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tailscale_version=$version" >> "$GITHUB_OUTPUT"
  binaries:
    needs: metadata
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zym013579/tailscale-android-cli
          ref: ${{ needs.metadata.outputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Compile the pinned Android source
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.metadata.outputs.tailscale_version }}
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "$VERSION"
          ./scripts/android.sh build "$ARCH"
          python3 scripts/verify-android.py "dist/tailscaled.$ARCH" "$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: module-binary-${{ matrix.arch }}
          path: dist/*.tgz
          if-no-files-found: error
  package:
    needs: binaries
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: module-binary-*
          path: build/binaries
          merge-multiple: true
      - name: Validate source and version manifests
        id: version
        run: |
          bash -n .github/tools/build.sh .github/tools/version-bump.sh
          for script in customize.sh service.sh uninstall.sh tailscale/settings.sh tailscale/scripts/*; do sh -n "$script"; done
          python3 .github/tools/version.py sync
          git diff --exit-code -- module.prop update.json update-arm.json update-arm64.json
          version=$(sed -n 's/^version=//p' module.prop)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Tag must match module.prop: $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          prerelease=false
          if [[ "${version##*.}" != 0 ]]; then prerelease=true; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Build and verify both installation packages
        run: |
          ./.github/tools/build.sh --binary-dir build/binaries
          python3 .github/tools/test-build.py
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: magisk-module
          path: dist/*
          if-no-files-found: error
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       contains(github.event.head_commit.message, 'release'))
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: magisk-module
          path: dist
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          args=(--latest)
          if [[ "$PRERELEASE" == true ]]; then args=(--prerelease); fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Magisk Tailscaled $VERSION" --generate-notes "${args[@]}" dist/*.zip dist/SHA256SUMS dist/build-info.json
